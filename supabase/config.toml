# Only what this repo relies on; the Supabase CLI fills in its defaults.
# The function and table live in the shared content-pipeline project
# (fpqyuzkrshokqxtjtffi): supabase link --project-ref fpqyuzkrshokqxtjtffi.
project_id = "socialteardown"

# The site's signup form posts without a Supabase key; the function checks
